name: demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # the action itself on the demo app: build the base and this commit, crawl both, compare
  demo:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        id: snappcrawl
        with:
          working-directory: examples/ios-demo
          base-ref: ${{ github.event.pull_request.base.sha || 'HEAD' }}
          max-screens: '20'
          max-depth: '3'
          minutes: '8'
          fail-on: broken
      - run: echo "verdict ${{ steps.snappcrawl.outputs.verdict }}"
